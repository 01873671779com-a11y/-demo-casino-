<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Statistics — Demo Casino</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .stats-container {
      width: 92%;
      max-width: 650px;
      margin: 30px auto;
      padding: 20px;
      background: #17121f;
      border: 2px solid gold;
      border-radius: 20px;
    }

    .stats-container h2 {
      color: gold;
      text-align: center;
      margin-bottom: 22px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .stat-card {
      background: #26202f;
      padding: 20px 10px;
      text-align: center;
      border-radius: 14px;
      border: 1px solid #59471c;
    }

    .stat-card h3 {
      color: #bbb;
      font-size: .9rem;
      margin-bottom: 10px;
    }

    .stat-card p {
      color: gold;
      font-size: 1.7rem;
      font-weight: bold;
    }

    .game-stats {
      margin-top: 25px;
      padding: 15px;
      background: #26202f;
      border-radius: 14px;
    }

    .game-stats h3 {
      color: gold;
      margin-bottom: 12px;
    }

    .game-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 5px;
      border-bottom: 1px solid #51465e;
      color: #ddd;
    }

    .back-link {
      display: block;
      text-align: center;
      color: gold;
      margin-top: 25px;
      text-decoration: none;
    }

    @media(max-width: 350px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <h1>📊 Game Stats</h1>
    <div class="balance-box">
      🪙 <span id="balance">1000</span>
    </div>
  </header>

  <main class="stats-container">

    <h2>🏆 Your Statistics</h2>

    <section class="stats-grid">

      <div class="stat-card">
        <h3>Total Games</h3>
        <p id="statTotalGames">0</p>
      </div>

      <div class="stat-card">
        <h3>Total Wins</h3>
        <p id="statWins">0</p>
      </div>

      <div class="stat-card">
        <h3>Total Losses</h3>
        <p id="statLosses">0</p>
      </div>

      <div class="stat-card">
        <h3>Win Rate</h3>
        <p id="statWinRate">0%</p>
      </div>

      <div class="stat-card" style="grid-column: 1 / -1;">
        <h3>Biggest Win (Net Profit)</h3>
        <p id="statBiggestWin">0</p>
      </div>

    </section>

    <section class="game-stats">
      <h3>🎮 Game-wise Statistics</h3>

      <div class="game-row">
        <span>🎰 Lucky Slots</span>
        <strong id="slotsGames">0</strong>
      </div>

      <div class="game-row">
        <span>🎲 Lucky Dice</span>
        <strong id="diceGames">0</strong>
      </div>

      <div class="game-row">
        <span>🃏 High-Low Cards</span>
        <strong id="cardsGames">0</strong>
      </div>

    </section>

    <a href="index.html" class="back-link">
      ← Back to Home
    </a>

  </main>

  <script>
    const USER_KEY = "demoCasinoUser";

    try {
      const user = JSON.parse(localStorage.getItem(USER_KEY) || "null");
      if (!user || !user.name) {
        location.href = "login.html";
      }
    } catch(e) {
      location.href = "login.html";
    }

    function updateBalance() {
      try {
        const data = JSON.parse(
          localStorage.getItem("demoCasinoData") || "null"
        );

        document.getElementById("balance").textContent =
          data && typeof data.balance === "number"
            ? data.balance : 1000;
      } catch(e) {}
    }

    updateBalance();
  </script>

  <script src="stats.js"></script>

</body>
</html>
